## 概念（concepts）

### 研究方法
- [方案設置評估法](../wiki/program-placement-evaluation.html) — 用「方案設置地區」對照「未設置地區」估計平均處理效果，緩解參與內生性 · 1 來源

### 發展經濟學與保險
- [微型健康保險](../wiki/micro-health-insurance.html) — 針對低收入族群的低保費健康保險；以 Grameen 的兩方制方案為例 · 1 來源
- [微型保險](../wiki/microinsurance.html) — 依風險收取定期保費、保護低收入者的保險 · 1 來源
- [微型貸款](../wiki/microcredit.html) — 給窮人（多為女性）的無擔保小額貸款；健康衝擊是脫貧的主要障礙 · 1 來源
- [非正式風險分擔](../wiki/informal-risk-sharing.html) — 儲蓄、變賣資產、親友移轉等非正式保險；保障能力有限 · 1 來源
- [保險需求理論](../wiki/insurance-demand-theory.html) — 期望效用下風險趨避者購買保險的理論與反面證據 · 1 來源
- [道德風險](../wiki/moral-hazard.html) — 投保後行為改變；共付額可能反而把極貧者推離正式醫療 · 1 來源
- [逆選擇](../wiki/adverse-selection.html) — 以平均風險訂價導致低風險者退出 · 1 來源
- [基本需求成本法](../wiki/cost-of-basic-needs.html) — 以最低營養與非食物需求成本劃定貧窮線 · 1 來源
