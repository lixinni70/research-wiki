## 研究焦點
_由使用者決定目前最關心的主題，Claude 據此安排優先順序。_

- 微型健康保險（MHI）與貧窮的關係

## 領域地圖

| 領域 | 核心問題 | 主要頁面 | 來源數 |
|---|---|---|---|
| 發展經濟學與保險 | 窮人如何面對健康風險？微型保險能減少貧窮嗎？ | [微型健康保險](../wiki/micro-health-insurance.html)、[微型貸款](../wiki/microcredit.html)、[非正式風險分擔](../wiki/informal-risk-sharing.html) | 1 |
| 研究方法 | 非實驗資料如何估計方案效果？ | [方案設置評估法](../wiki/program-placement-evaluation.html) | 1 |

## 演進中的核心論點
- **微型貸款需要健康保障**：健康衝擊是微型貸款借款人無法脫貧的主要原因，而非正式保險在重大疾病時保障不足（[微型貸款](../wiki/microcredit.html)、[非正式風險分擔](../wiki/informal-risk-sharing.html)）。
- **MHI 的減貧效果仍不明確（截至 2011 年的證據）**：在 Grameen 的地區，MHI 只和糧食充足度有顯著正向關聯；微型貸款本身的效果比較明確（[Can Micro Health Insurance Reduce Poverty? Evidence From Bangladesh](../wiki/2011-hamid-micro-health-insurance-poverty-bangladesh.html)）。
- **方案設計決定成效**：共付額和保障深度可能是效果不顯著的原因（[道德風險](../wiki/moral-hazard.html)、[微型健康保險](../wiki/micro-health-insurance.html)）。

## 主要爭議
