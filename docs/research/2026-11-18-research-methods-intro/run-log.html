```

- G2：執行 3 次（1 次漏抓、1 次抓到 6 個舊錯誤、1 次通過）
- G3：執行 6 次，全部通過
- G4：執行 6 次＋1 次反向測試；另外修正檢查腳本 2 次
- 退回 N2：2 次；退回 N5：3 次；退回 N4、N1：0 次

## 反思

**最常出錯的節點：N2 寫入 wiki，以及 N5 生成 HTML。**
- N2 的錯誤都是「格式被破壞」（數學式、連結），內容本身沒錯，但讀者看到的是壞掉的頁面。
- N5 的錯誤是「看得到但不好讀」（版面太空、字太小），數字和出處都正確。

**檢查往前移到哪裡：**
1. 數學式和連結格式原本要等到看網站才會發現，現在移到 **G2**（E4、E5），寫入 wiki 後立刻檢查。這一移就抓到 10 天前留下的 6 個錯誤。
2. 版面密度原本要等人工看截圖，現在移到 **G4**（W1），每次生成都自動量。
3. 大綱和 HTML 原本分開寫，可能不一致；現在 N4、N5 用**同一份資料**產生，從源頭避免。

**有沒有修改 workflow：有。**
- CLAUDE.md 4.6 的 G2、G4 補上新檢查項目；新增「檢查腳本要先做反向測試」的規則，因為第 11 列顯示檢查工具本身也會出錯，通過不代表沒問題。
- 寫入 wiki 時禁止用 shell heredoc 寫含 `$` 的內容（第 4 列的根本原因）。
- 理由：同一類錯誤出現兩次以上，就應該變成自動檢查，而不是靠人記得。
