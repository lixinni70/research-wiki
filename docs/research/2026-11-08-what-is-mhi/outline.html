## 1｜封面
- **標題**：什麼是微型健康保險？為什麼需要討論？
- **副標**：LLM Wiki 研究產出 · 2026-11-08

## 2｜章節：01 什麼是微型健康保險
- **講者備註**：先講定義，再看一個實例。

## 3｜定義
- **重點**：
  - 微型保險：依風險收取定期保費，保護低收入者
  - MHI：微型保險中專門針對健康風險的一種
  - 常透過微型金融機構提供
- **視覺**：Churchill 定義的引文框
- **出處**：[微型保險](../../wiki/microinsurance.html)、[微型健康保險](../../wiki/micro-health-insurance.html)

## 4｜保險的基本邏輯
- **重點**：
  - 把不確定的大損失，換成確定的小支出
  - 風險趨避者在 $EU_i > EU_0$ 時會投保
- **視覺**：兩條期望效用公式
- **出處**：[保險需求理論](../../wiki/insurance-demand-theory.html)

## 5｜實例：Grameen 的 MHI
- **重點**：
  - 兩方制：保險人就是醫療提供者
  - 性質接近「醫療預付」
- **視覺**：左邊是三方制和兩方制的對照圖；右邊是方案重點表（保費、給付、規模）
- **出處**：[Grameen Kalyan](../../wiki/grameen-kalyan.html)、[微型健康保險](../../wiki/micro-health-insurance.html)

## 6｜章節：02 為什麼需要討論

## 7｜微型貸款的缺口
- **重點**：
  - 健康衝擊是借款人無法脫貧的主要原因
  - 非正式保險在重大疾病時只能保障約 30% 的消費
- **視覺**：大數字 70% 和 30%
- **出處**：[微型貸款](../../wiki/microcredit.html)、[非正式風險分擔](../../wiki/informal-risk-sharing.html)

## 8｜效果證據有限
- **重點**：四項貧窮指標中，只有糧食充足度顯著
- **視覺**：迴歸結果表，糧食充足度那一列以淺底色標示
- **出處**：[Can Micro Health Insurance Reduce Poverty? Evidence From Bangladesh](../../wiki/2011-hamid-micro-health-insurance-poverty-bangladesh.html)

## 9｜方案設計上的取捨
- **視覺**：四格卡片
  - 共付額的兩面性
  - 保障深度不足
  - 逆選擇不嚴重
  - 評估方法困難
- **出處**：[道德風險](../../wiki/moral-hazard.html)、[逆選擇](../../wiki/adverse-selection.html)、[方案設置評估法](../../wiki/program-placement-evaluation.html)

## 10｜小結與 wiki 缺口
- **重點**：
  - MHI 補上了微型貸款的健康缺口
  - 減貧效果目前證據薄弱
  - wiki 只有 1 份來源，缺少隨機實驗和跨國證據
