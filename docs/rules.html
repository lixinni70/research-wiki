<div class="wrap full"><main><div class="crumb">專案規則</div><script type="text/markdown" id="md"># CLAUDE.md — 研究 Wiki 知識庫 維護規範

> 本檔是這個知識庫的「schema」。每次開啟新的對話時，先讀完本檔再動手。
> 本檔會隨使用經驗持續修訂；修訂時在 `wiki/log.md` 記一筆 `schema` 紀錄。

---

## 1. 這個 Wiki 是什麼

這是一個**不限主題的個人研究知識庫**，採用 Karpathy 提出的「LLM Wiki」模式（由 LLM 維護的 wiki）。它有三個出口：Obsidian（自己閱讀）、研究產出（筆記與簡報），以及 GitHub Pages 網站（公開瀏覽，見第 9 節）。

- **不是 RAG**：不在每次提問時才從原始文件撈片段，而是由你（Claude）把每份來源讀過、消化、整合進一套持續累積、互相連結的 Markdown 頁面。
- **知識是編譯一次、持續維護的**：交叉引用已經建好、矛盾已經標出、綜述已經反映所有讀過的內容。
- **分工**：使用者負責挑選來源、提出問題、引導方向、思考意義；你負責所有整理工作——摘要、交叉引用、歸檔、一致性維護、記錄。使用者很少親手寫 wiki。
- **閱讀介面**：使用者用 Obsidian 瀏覽（圖譜檢視、反向連結、Dataview）。所以連結、frontmatter、檔名都要符合 Obsidian 慣例。

研究範圍：由使用者放入的來源決定，可以跨領域。目前的領域列在 `wiki/overview.md` 的「領域地圖」。每個頁面用 frontmatter 的 `domain` 欄位標示所屬領域。

## 2. 目錄結構

```
wiki llm/
├── CLAUDE.md              ← 本檔（schema）
├── README.md              ← 給人看的簡介與使用方式
├── raw/                   ← 原始來源（不可修改）
│   ├── papers/            ← 論文 PDF / arXiv 轉出的 Markdown
│   ├── articles/          ← 部落格、新聞、技術報告（Obsidian Web Clipper 剪下的文章）
│   ├── notes/             ← 演講、Podcast、影片筆記、使用者自己的筆記
│   ├── data/              ← 表格、評測數據、CSV
│   └── assets/            ← 圖片與附件
├── wiki/                  ← 由 Claude 全權撰寫與維護
│   ├── index.md           ← 內容目錄（每頁一行）
│   ├── log.md             ← 時間序紀錄（只增不改）
│   ├── overview.md        ← 領域總覽 + 演進中的核心論點
│   ├── questions.md       ← 開放問題、待查資料、建議閱讀
│   ├── sources/           ← 每份來源一頁摘要
│   ├── concepts/          ← 概念、技術、方法（如 attention、RLHF、MoE）
│   ├── models/            ← 模型或模型家族（如 GPT-4、Llama 3、Claude）
│   ├── orgs/              ← 機構、實驗室、公司
│   ├── people/            ← 研究者
│   ├── benchmarks/        ← 資料集與評測基準
│   ├── comparisons/       ← 比較分析（A vs B、方法對照表）
│   ├── syntheses/         ← 主題綜述、查詢產生的分析、時間線
│   └── assets/            ← Claude 產生的圖表
├── templates/             ← 各類頁面的範本
├── build.py               ← 建置網站：wiki/ + outputs/ + CLAUDE.md → docs/
├── site/                  ← 網站原始樣式（site.css、site.js、vendor/）
├── docs/                  ← 網站成品（GitHub Pages 發布；自動產生，不要手改）
└── outputs/               ← 研究產出（筆記、簡報），每個題目一個資料夾
    └── YYYY-MM-DD-題目/
        ├── notes.md           ← 研究筆記
        ├── slides-outline.md  ← 簡報逐頁內容
        ├── slides.html        ← HTML 簡報
        └── assets/            ← 圖表
```

### 層級規則

| 層 | 誰寫 | 規則 |
|---|---|---|
| `raw/` | 使用者 | **唯讀**。絕不修改、改名、移動或刪除。它是事實的最終依據。 |
| `wiki/` | Claude | 你全權負責建立、更新、重構。 |
| `outputs/` | Claude | 研究產出；內容只能來自 wiki（見 4.4）。 |
| `site/`、`build.py` | Claude | 網站樣式與建置腳本；修改前先告知使用者。 |
| `docs/` | `build.py` | **不要手改**，一律修改來源後重新建置。 |
| `CLAUDE.md`、`templates/` | 共同 | 只有在使用者同意下才修改。 |

## 3. 頁面規範

### 3.1 語言

- 正文使用 **繁體中文**（台灣用語）。
- 技術術語第一次出現時附英文原文：「人類回饋強化學習（Reinforcement Learning from Human Feedback, RLHF）」，之後可只用縮寫。
- 模型名、論文標題、機構名、人名保留原文（人名可附中文慣用譯名）。
- 直接引用原文時保留英文，並視需要附中文翻譯。

### 3.2 檔名

- 一律 **英文小寫 kebab-case**，避免空白與中文，確保跨平台與連結穩定：`rlhf.md`、`mixture-of-experts.md`、`llama-3.md`。
- **全 wiki 檔名必須唯一**（Obsidian 的 `[[連結]]` 依檔名解析，不看資料夾）。
- 來源頁命名：`YYYY-第一作者姓-短標題.md`，例如 `2017-vaswani-attention-is-all-you-need.md`；沒有作者的文章用機構或網站名：`2024-anthropic-claude-3-model-card.md`。
- 人物頁：`名-姓.md`，例如 `ilya-sutskever.md`。

### 3.3 Frontmatter（每頁必填）

```yaml
---
type: concept            # source | concept | model | org | person | benchmark | comparison | synthesis | overview
title: 人類回饋強化學習
aliases: [RLHF, Reinforcement Learning from Human Feedback]
tags: [對齊, 後訓練]
created: 2026-11-08
updated: 2026-11-08
sources: ["[[2022-ouyang-instructgpt]]"]   # 支撐本頁內容的來源頁
status: draft            # stub | draft | solid
---
```

- `aliases` 放英文名、縮寫、中文別名，讓 Obsidian 搜尋與連結都找得到。
- 來源頁另加：`authors`、`year`、`venue`、`url`、`raw`（指向 `raw/` 中的檔案路徑）、`ingested`（匯入日期）。
- 模型頁另加：`org`、`released`、`params`（若已知）、`open_weights`（true/false）。
- `domain`：所屬領域，例如 `發展經濟學`、`研究方法`、`LLM`。`index.md` 依類型分節，`overview.md` 的領域地圖依 `domain` 分組。新領域第一次出現時，要在領域地圖新增一列。
- `status`：`stub` = 只有一兩句；`draft` = 有內容但不完整；`solid` = 內容完整且有多個來源支持。

### 3.4 連結與引用

- 內部連結用 Obsidian wikilink：`[[rlhf]]`、`[[rlhf|RLHF]]`。
- **每個實質主張都要可追溯**：句末以來源頁連結標註，例如「InstructGPT 1.3B 在人類偏好上勝過 GPT-3 175B（<span class="missing" title="尚未建立的頁面">2022-ouyang-instructgpt</span>）。」
- 數字（參數量、分數、成本、日期）一定要附來源，不憑記憶填寫。
- 你自己的推論或綜合判斷要明確標示：「**（推論）** …」或寫在「綜合分析」小節。
- 第一次提到某個已有頁面的實體或概念時，就加上連結；同一頁內不必重複連結。
- 提到一個重要但尚無頁面的概念時，仍可先寫 `[[新概念]]` 連結（Obsidian 會顯示為未建立），並在 lint 時決定是否建立。

### 3.5 標記矛盾、過時與不確定

使用 Obsidian callout：

```markdown
> [!warning] 矛盾
> [[2022-hoffmann-chinchilla]] 認為最佳 token/參數比約 20:1，與 [[2020-kaplan-scaling-laws]] 的結論不同。差異主要來自學習率排程與模型規模範圍的設定。

> [!note] 已過時
> 此段描述的是 2023 年的狀態，[[2024-xxx]] 之後已有更新。

> [!question] 待確認
> 原文未說明評測是否使用 few-shot。
```

**不要默默覆蓋舊說法**：新來源與既有內容衝突時，保留兩方說法、標註矛盾、說明可能原因，並在 `questions.md` 記錄待釐清事項。

### 3.6 各類頁面的結構

詳細範本見 `templates/`。重點：

- **source（來源頁）**：基本資訊 → 一句話摘要 → 核心貢獻 → 方法 → 主要結果（含數字）→ 限制與批評 → 與既有知識的關係（支持／挑戰哪些頁面）→ 值得記住的引文 → 影響到的 wiki 頁面。
- **concept（概念頁）**：定義 → 直覺解釋 → 運作方式 → 發展脈絡（時間序）→ 變體與相關方法 → 優缺點與爭議 → 代表性來源 → 相關概念。
- **model（模型頁）**：基本資訊表 → 架構與訓練重點 → 能力與評測結果 → 特色與創新 → 版本演進 → 相關來源。
- **org / person**：簡介 → 主要貢獻 → 相關模型／論文 → 時間線。
- **benchmark**：評測什麼 → 格式與規模 → 主要成績表（標註來源與日期）→ 已知問題（污染、飽和）→ 相關基準。
- **comparison**：比較目的 → 對照表 → 分析 → 結論與適用情境。
- **synthesis**：問題或主題 → 綜合分析 → 證據 → 不確定之處 → 延伸問題。

## 4. 工作流程

### 4.1 匯入（Ingest）

使用者放入新來源並說「匯入 xxx」，或在對話中直接貼上、附上文章時：

0. **先存原檔到 `raw/`**：使用者在對話中附上或貼上的文章，一律先存進 `raw/` 再處理。
   - 論文 PDF → `raw/papers/`；網路文章或貼上的文字 → `raw/articles/`（存成 `.md`，開頭註明來源網址與取得日期）；演講、影片、Podcast 筆記 → `raw/notes/`；表格或數據 → `raw/data/`。
   - 檔名與來源頁相同：`YYYY-第一作者姓-短標題.副檔名`。
   - 存入後就視為唯讀。
1. **讀取來源**：完整閱讀 `raw/` 中的檔案。PDF 先擷取文字；含圖片的 Markdown 先讀文字，再視需要逐一檢視重要圖片（尤其是結果圖表）。
2. **先讀既有脈絡**：讀 `wiki/index.md`、`wiki/overview.md`，找出可能相關的既有頁面並讀過。
3. **與使用者討論**：用 3–6 點列出關鍵收穫，並說明它與現有 wiki 的關係（新增了什麼、支持或挑戰了什麼）。詢問使用者想強調的面向。*（若使用者說「批次匯入」或「不用討論」，則跳過此步，直接處理。）*
4. **寫來源頁**：在 `wiki/sources/` 建立摘要頁。
5. **更新相關頁面**：建立或更新受影響的概念、模型、機構、人物、基準頁。一份來源通常會動到 5–15 頁。更新時：
   - 把新資訊整合進對應段落，不要只是在頁尾附加。
   - 補上引用與交叉連結（雙向：A 連到 B，B 也應提到 A）。
   - 遇到衝突照 3.5 處理。
   - 更新 `updated` 日期與 `sources` 清單，必要時調整 `status`。
6. **更新 `overview.md`**：若這份來源改變了領域全貌或核心論點，修訂之。
7. **更新 `questions.md`**：加入這份來源引出的新問題與建議閱讀。
8. **更新 `index.md`**：新增頁面並調整既有條目的摘要。
9. **寫入 `log.md`**：附加一筆紀錄（格式見第 5 節），列出建立與更新的頁面。
10. **回報**：簡短告訴使用者做了哪些變更。

### 4.2 查詢（Query）

使用者提問時：

1. 先讀 `index.md` 找相關頁面，再深入閱讀。必要時回到 `raw/` 原文查證細節。
2. 以 wiki 內容為主回答，**附上頁面引用**（`[[頁面]]`）。若 wiki 不足以回答，明說缺口，並建議可補充的來源；經使用者同意可上網搜尋。
3. 回答形式依問題而定：一段文字、比較表、時間線、圖表（matplotlib 產生的圖存到 `wiki/assets/`；簡單流程圖用 Mermaid）、Marp 簡報。
4. **有價值的答案要歸檔**：比較、分析、新發現的關聯，詢問使用者後存成 `wiki/comparisons/` 或 `wiki/syntheses/` 中的頁面，並更新 index 與 log。探索的成果應該和匯入的來源一樣累積下來。
5. 在 `log.md` 記一筆 `query`。

### 4.3 健檢（Lint）

使用者說「健檢」或「lint」時，檢查並回報：

- 頁面之間互相矛盾的說法
- 已被較新來源取代的過時主張
- 孤兒頁（沒有任何反向連結）
- 被多次提及但還沒有獨立頁面的重要概念（未建立的 `[[連結]]`）
- 缺少的交叉引用、單向連結
- 沒有來源支撐的主張或數字
- frontmatter 缺漏或格式錯誤、檔名重複
- `index.md` 與實際檔案不一致
- 可以透過網路搜尋補齊的資料缺口
- 建議接下來值得研究的問題與值得找的來源

先列出問題清單與建議修正，經使用者同意後再修改（明顯的格式問題可直接修）。完成後在 `log.md` 記一筆 `lint`。

### 4.4 研究產出（Research）

使用者說「研究：…」或提出一個要做成筆記或簡報的問題時：

**鐵則：正文只能使用 wiki 裡已有的內容。**
- 每個主張、數字、引文都必須來自 `wiki/` 頁面，或是 wiki 來源頁所對應的 `raw/` 原文，並以 `[[頁面]]` 標註出處。
- 網路搜尋**只用來找相關文獻**，搜到的內容一律不寫進正文，只列在最後的「建議參考文獻」。
- 必要的一般背景說明要少量，並標示為「（背景）」。自己的推論標示為「（推論）」。
- wiki 內容不足以支撐題目時，先告訴使用者缺口在哪裡，不要硬寫。

**步驟**
1. 讀 `wiki/index.md`，找出相關頁面並讀過，必要時回 `raw/` 查原文。
2. 上網搜尋相關文獻，找出 wiki 還沒有的重要來源。
3. 建立 `outputs/YYYY-MM-DD-題目短名/notes.md`，結構如下：
   - frontmatter：`type: research-note`、`question`、`created`、`wiki_pages`（用到的頁面）、`wiki_source_count`（當時 wiki 的來源總數）
   - 研究問題 → 摘要 → 正文分節（每個主張附 `[[出處]]`）→ 不確定之處與缺口 → 建議參考文獻
4. **建議參考文獻**的格式：
   - 每筆附**可以直接下載的連結**，優先順序是：arXiv PDF（`https://arxiv.org/pdf/xxxx`）→ 作者或機構公開的 PDF → 開放取用版本 → DOI 連結（若只有付費版，就標「付費」）。
   - 每筆一行說明它能補 wiki 的哪個缺口。
   - 建議存檔名，例如 `→ raw/papers/2010-cai-microinsurance-trust.pdf`。使用者下載並存進 `raw/` 後，說「匯入」就會走 4.1 流程。
   - 同時把這些文獻加進 `wiki/questions.md` 的「建議閱讀」，避免重複。
5. 使用者要簡報時：
   - 先做 `slides-outline.md`：每頁包含標題、3–5 個重點、建議的視覺元素、講者備註、出處。
   - 確認後再做 `slides.html`：單一檔案，可離線開啟，用鍵盤翻頁，可列印成 PDF。風格依第 8 節的設定。
6. 問使用者是否要把筆記濃縮成 `wiki/syntheses/` 的一頁並更新 index（不自動回存）。
7. 在 `log.md` 記一筆 `research`。

### 4.5 數學式（LaTeX）

- **Markdown（wiki 與 notes）**：行內用 `$...$`，獨立式子用 `$$...$$`。Obsidian 內建 MathJax，可以直接顯示。
- 不要用 `\(...\)` 或 `\[...\]`，Obsidian 無法顯示。
- **HTML 簡報**：內嵌 KaTeX（JS、CSS、字型都直接寫進 HTML，不使用 CDN；含 auto-render，支援 `$...$` 和 `$$...$$`），寫法和筆記相同，可以直接複製。
- 數學式中的文字用 `\text{}`。

## 5. `index.md` 與 `log.md` 格式

### index.md（內容導向）

依類別分節，每頁一行：

```markdown
## 概念
- [[rlhf]] — 用人類偏好訓練獎勵模型再以強化學習微調 LLM 的方法 · 3 來源
```

每次匯入、新增或刪除頁面都要更新。查詢時先讀 index。

### log.md（時間序，只增不改）

每筆紀錄以固定前綴開頭，方便用 `grep "^## \[" wiki/log.md | tail -5` 查看：

```markdown
## [2026-11-08] ingest | Attention Is All You Need
- 新建：[[2017-vaswani-attention-is-all-you-need]]、[[transformer]]、[[self-attention]]
- 更新：[[overview]]、[[index]]
- 備註：使用者希望強調位置編碼的設計動機
```

操作類型：`ingest` | `query` | `lint` | `research` | `refactor` | `schema` | `setup`

**只在檔案尾端附加，不修改舊紀錄。**

## 6. 品質原則

1. **可追溯優先**：寧可寫「來源未說明」，也不要用記憶補數字。
2. **整合而非堆疊**：新資訊要融入現有結構；頁面變長變亂時就拆頁或重寫。
3. **保留爭議**：研究領域充滿互相矛盾的結果，wiki 要呈現爭議，而不是假裝有定論。
4. **時效性**：許多領域（尤其是科技）變化很快。凡是「目前最強」「最新」「SOTA」之類的說法，都要寫明時間點，例如「（截至 2024-06）」。
5. **一頁一主題**：概念頁不寫成論文摘要；來源頁不寫成教科書。
6. **連結密度適中**：連結重要的關係，不要每個名詞都連。
7. **小步修改**：大規模重構（改名、拆併頁面）前先告知使用者，並在 log 記錄 `refactor`。

## 8. 簡報風格

**選定風格：C「暖灰褐」**（2026-11-08）。樣板：`templates/slides-template.html`，新簡報一律從這個樣板複製開始。

- **原則**：專業、簡單明瞭、低飽和度。
- **比例**：16:9（1280×720）。
- **版面**：左側 24px 主色直條；標題下方有分隔線；頁尾左邊放題目，右邊放頁碼；出處放在頁尾上方，用小字灰色。
- **色票**：

  | 用途 | 名稱 | 色碼 |
  |---|---|---|
  | 底色 | bg | `#F7F5F1` |
  | 主文字 | ink | `#2C3136` |
  | 主色 | primary | `#6E6259` |
  | 圖表色 2 | c2 | `#9AA5A8` |
  | 圖表色 3 | c3 | `#B9A08A` |
  | 圖表色 4 | c4 | `#8C8C7A` |
  | 圖表色 5 | c5 | `#A88E8E` |
  | 淺底 | tint | `#ECE7E1` |
  | 線條 | line | `#DDD6CD` |

- **字型**：Noto Sans TC → 微軟正黑體（無襯線）。
- **版型**：
  - 頁面類：封面、章節頁（主色滿版）、引文框、數學框
  - 內容類：左文右圖、滿版圖、表格（重點列以淺底色標示）、大數字卡、長條圖、四格卡片、參考文獻
- **圖片**：
  - 來自 `raw/assets/`（原文圖）或 `wiki/assets/`（Claude 繪製），在 HTML 中以相對路徑引用。
  - 白底細框，等比例縮放，下方附圖說。
  - matplotlib 繪圖使用上方色票、白底、無外框線、灰色細格線。
- **數學式**：KaTeX **內嵌在 HTML 中**（不使用 CDN），離線也能顯示。
- **操作**：
  - ←／→ 翻頁，N 顯示講者備註，F 全螢幕
  - 列印時每頁一張 16:9

## 9. 網站（GitHub Pages）

網站把 wiki 和研究產出公開呈現，讓沒有 Obsidian 的人也能瀏覽。**網站完全由 `build.py` 從 Markdown 產生**，所以只要照前面各節的規則寫好 Markdown，網站就會自動跟上。

### 9.1 頁面對應

| 來源 | 網址 | 說明 |
|---|---|---|
| （自動產生） | `index.html` | 首頁：簡介、統計數字、入口卡片、最新研究、最近更新（讀 `log.md`） |
| `wiki/**/*.md` | `wiki/<檔名>.html` | 每個 wiki 頁面一頁；wiki 子資料夾不出現在網址中，所以檔名必須唯一（見 3.2） |
| `outputs/<題目>/notes.md` | `research/<題目>/index.html` | 研究筆記 |
| `outputs/<題目>/slides-outline.md` | `research/<題目>/outline.html` | 逐頁大綱 |
| `outputs/<題目>/slides.html` | `research/<題目>/slides.html` | 簡報，原檔直接複製 |
| （自動產生） | `research/index.html` | 所有研究產出列表 |
| `CLAUDE.md` | `rules.html` | 專案規則 |
| `raw/assets/`、`wiki/assets/` | 同路徑 | 圖片 |

頂端導覽列固定為：首頁、目錄、總覽、研究產出、開放問題、更新紀錄、專案規則。要新增導覽項目，就改 `build.py` 的 `NAV`。

### 9.2 build.py 自動處理的事
- **連結**：`[[頁面]]`、`[[頁面|文字]]` 轉成相對連結；找不到的頁面顯示成灰色虛線（等同 Obsidian 的未建立連結），並在建置時列出來。
- **側欄**：frontmatter 轉成「頁面資訊」側欄，包含狀態、作者、日期、標籤和來源。
- **反向連結**：自動計算，顯示在側欄。
- **Obsidian callout**（`> [!warning]` 等）轉成有顏色的提示框。
- **數學式**：`$...$` 和 `$$...$$` 用 KaTeX 顯示，字型已內嵌，離線也能用。
- **程式碼**：程式碼區塊裡的 `[[...]]` 和 `$` 不轉換。

### 9.3 網站風格
沿用第 8 節的風格 C 色票。版面特色：左側 10px 主色直條、米白底、細線分隔、資訊側欄有主色頂線。樣式只寫在 `site/site.css`，不要在 Markdown 裡寫行內樣式。手機寬度下側欄移到內文下方。

### 9.4 更新網站的流程（每次匯入、研究、修改之後）
1. 照 4.1／4.4 寫好 Markdown，並更新 index 和 log。
2. 執行 `python build.py`。它只用標準函式庫，不需要安裝套件。
3. 檢查輸出的「尚未建立的連結」，判斷要建立頁面，還是改掉連結。
4. 用瀏覽器打開 `docs/index.html`，抽查新頁面。
5. 提醒使用者 commit 並 push。GitHub Pages 設定為 `main` 分支的 `/docs`，push 後約 1 分鐘網站就會更新。

### 9.5 新增一種頁面類型
例如要新增「書籍」類型：
1. 在 `templates/` 新增樣板。
2. 在 wiki 新增子資料夾。
3. 在 3.3 和 3.6 補上欄位和結構。
4. 在 `build.py` 的 `TYPE_LABEL` 加上中文名稱。
5. 在 `index.md` 新增一節。

## 10. 待使用者決定 / 之後可擴充

- 整個專案已用 git 管理並發布到 GitHub；建議每次匯入或研究後就 commit 一次，commit 訊息格式：`ingest: 標題`、`research: 題目`、`site: 說明`。
- wiki 超過數百頁時，是否導入搜尋工具（例如 [qmd](https://github.com/tobi/qmd)）取代單靠 index。
- 是否加入 Dataview 查詢頁（例如列出所有 `status: stub` 的頁面）。
- 研究重點與優先主題：寫在 `wiki/overview.md` 的「研究焦點」小節。
